<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AS Garages</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" hidden>
  <div id="stage"></div>

  <div id="titleblock"></div>
  <div id="tabs" class="glass"></div>
  <button id="themebtn" class="glass" type="button" aria-label="Toggle light and dark mode"></button>
  <div id="searchbox" class="glass">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="search" type="text" autocomplete="off" aria-label="Search">
  </div>
  <div id="toast" class="glass" hidden></div>

  <aside id="detail" class="glass"></aside>
  <div id="strip"></div>
  <div id="hints"></div>

  <div id="officer" hidden><div id="officerbox" class="glass"></div></div>
  <div id="modal" hidden><div id="modalbox" class="glass"></div></div>
  <div id="admin" hidden></div>
</div>
<script src="app.js"></script>
<script src="admin.js"></script>
</body>
</html>
